# Stage 1 (Table 1 of the plan): online SGD since 2026-11-13 (was the population solver; PLAN.md §8, §10).
# The scaling and weight-norm questions at one hidden-layer learning per task, λ = 4 (the hidden
# channel alone leaves a residual of e^-4 ≈ 2 %, so every task is learned well; the readout's own
# exponent λᵃ_c = Λ‖M_c‖ is derived from (λ, δ₀), not set).  The λ axis (hidden-layer learning per
# task vs error) is a later stage at fixed δ₀ (PLAN.md §0 decision 7).
# gated: 6 N × 2 κ × 3 readouts × 6 δ₀ × 1 λ × 8 seeds = 1728 runs, plus the extra cell
#        κ = 4 at N = 100 (3 readouts × 6 δ₀ × 8 seeds = 144 runs) for M5's fitted κ exponent
# ungated (no κ, listed once per N): 6 N × 2 readouts × 6 δ₀ × 1 λ × 8 seeds = 576 runs
name: stage1
N: [5, 10, 20, 50, 100, 200]
kappa: [1.0, 2.0]
extra: [{N: 100, kappa: 4.0}]
readout: [gated_shared, learned_shared, gated_frozen, frozen, task_heads]
delta0: [-0.75, -0.5, 0.0, 1.0, 4.0, 16.0]
lam: [4.0]                 # hidden-layer learning per task; Stage 1: fixed, the λ sweep is a later stage
seeds: 8
# solver: sgd = online SGD, one fresh sample per step (eqs. sgdW–sgda), n = round(λD/(η(1 + δ₀))) steps per task on
# the nominal clock; pop = population-gradient steps (n = λ/pop_contraction = 40, the task clock below).
solver: sgd
# auto: sgd → sgd_contraction/(1 + δ₀) = 0.05/(1 + δ₀), so n = 20λD/B = 320N/B steps per task at every δ₀; pop → 1
eta: [auto]
# samples per SGD step: a step sums the updates of B fresh samples at the same η, so n = 320N/B steps per task;
# 1 = online SGD (the write-up's eqs. sgdW–sgda).  --sgd_batch on any script overrides it.  16 since 2026-11-13:
# 20N steps per task, 10–43× faster per task than B = 1 at N = 100 with the same end-of-task loss (PLAN.md §10)
sgd_batch: 16
h_max: 1.0
# h ā² ≤ 0.1 (plan).  old/validate.py measures an O(h) Euler bias of
# ΔS(0) ≈ +0.017 (frozen) / +0.005 (learned) at this value at N=10, λ=1;
# 0.01 costs 10× the steps (n_steps = 100λ per task) and reduces it 10×.
pop_contraction: 0.1
D_factor: 4
# burn-in and measurement window: T_burn = T_meas = 7·N tasks for every κ.  The longest half-life
# of any readout is the task heads' N ln 2/(θν), so 7N is 7θν/ln 2 ≈ 10 half-lives for every
# readout (9.9ν at λ = 4; make_runs notes any cell under burn_halflives).  T_factor is the N/κ²
# form, unused here
T_per_N: 7.0
T_factor: 10.0
batch_size: 64
# task clock (write-up, "Decision: the task clock"): realized = (ii), every task lasts Λ_c = λ/ā²_c with the key
# norm it starts with, so λ is the hidden-layer learning per task for every readout; nominal = (i), Λ = λ/(1 + δ₀)
clock: realized
